services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  api-contacorrente:
    build:
      context: .
      dockerfile: src/ContaCorrente/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__ContaCorrente=Data Source=/data/contacorrente.db
      - Jwt__Secret=BankMoreSuperSecretKey2024BankMoreSuperSecretKey2024
      - Jwt__Issuer=BankMore
      - Jwt__Audience=BankMore
      - Jwt__ExpirationMinutes=60
      - Kafka__Brokers=kafka:9092
      - Seq__Url=http://seq:5341
      - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
    volumes:
      - contacorrente-data:/data
    depends_on:
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api-transferencia:
    build:
      context: .
      dockerfile: src/Transferencia/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Transferencia=Data Source=/data/transferencia.db
      - Jwt__Secret=BankMoreSuperSecretKey2024BankMoreSuperSecretKey2024
      - Jwt__Issuer=BankMore
      - Jwt__Audience=BankMore
      - Jwt__ExpirationMinutes=60
      - ContaCorrenteApi__BaseUrl=http://api-contacorrente:8080
      - Kafka__Brokers=kafka:9092
      - Seq__Url=http://seq:5341
      - OpenTelemetry__OtlpEndpoint=http://jaeger:4317
    volumes:
      - transferencia-data:/data
    depends_on:
      api-contacorrente:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker-tarifas:
    build:
      context: .
      dockerfile: src/Tarifas/Dockerfile
    environment:
      - DOTNET_ENVIRONMENT=Production
      - ConnectionStrings__Tarifas=Data Source=/data/tarifas.db
      - Kafka__Brokers=kafka:9092
      - Tarifas__PercentualTarifa=1.0
      - Seq__Url=http://seq:5341
    volumes:
      - tarifas-data:/data
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    ports:
      - "5340:80"
      - "5341:5341"
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=Admin@123
    restart: unless-stopped

  frontend:
    build:
      context: src/Frontend/bankmore-app
      dockerfile: Dockerfile
    ports:
      - "8090:80"
    depends_on:
      api-contacorrente:
        condition: service_healthy
      api-transferencia:
        condition: service_healthy
    restart: unless-stopped

volumes:
  contacorrente-data:
  transferencia-data:
  tarifas-data:
  grafana-data:
